name: digitaleseiten
description: >-
  Digitale Seiten is a German online marketing company that operates a network of
  28+ industry-specific business directories for craftspeople and local service
  providers (for example Elektriker.org, Klempner.org, Maler.org and Dachdecker.org).
  The platform lets tradespeople create free business listings, distributes regional
  customer inquiries and job requests to registered companies as leads, improves their
  search-engine visibility, and provides review-collection tools. According to the
  company it lists 869,000+ registered businesses and has matched 765,000+ job
  assignments. It is a B2B directory and lead-generation service and does not publish
  a public developer API, documentation, or developer portal. Backed by Point Nine.
